name: Release

# Tag-driven release: git tag X.Y.Z → GitHub release. Tags are bare x.y.z
# (no v prefix). Images are built locally — nothing is pushed to a registry.

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-tag:
    name: Auto-version + tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: guard
        name: Guard (skip release commits / already tagged)
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == "chore(release):"* ]]; then
            echo "HEAD is a release commit — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git tag --points-at HEAD | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD already tagged — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - id: tag
        name: Tag merged VERSION
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be bare semver x.y.z, got: ${version}" >&2
            exit 1
          fi
          git tag "${version}"
          git push origin "${version}"

  release:
    name: GitHub release
    needs: auto-tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
