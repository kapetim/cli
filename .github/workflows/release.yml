name: Release

# Tag-driven release: git tag X.Y.Z -> GitHub release + binaries + image push.
# Tags are bare x.y.z (no v prefix). VERSION must be bumped in the merged PR.
# Image push to Docker Hub requires DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets.

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-tag:
    name: Auto-version + tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: guard
        name: Guard (skip release commits / already tagged)
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == "chore(release):"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git tag --points-at HEAD | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - id: tag
        name: Tag merged VERSION
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be bare semver x.y.z, got: ${version}" >&2
            exit 1
          fi
          git tag "${version}"
          git push origin "${version}"

  release:
    name: GitHub release
    needs: auto-tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  binary:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: auto-tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          name="cli-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/kapetim/cli/src/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "$name" ./src/cmd/cli
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: cli-${{ matrix.goos }}-${{ matrix.goarch }}

  image:
    name: Publish image (Docker Hub)
    needs: auto-tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: creds
        name: Check Docker Hub credentials
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.creds.outputs.ok == 'true'
        name: Build and push
        run: |
          set -euo pipefail
          image="kapetim/cli:${GITHUB_REF_NAME}"
          docker build -t "$image" .
          docker push "$image"
