name: Release

# Tag-driven release. VERSION is bare semver (x.y.z); the git tag carries the Go
# `v` prefix (vX.Y.Z) and the Docker tag is the bare number (kapetim/cli:X.Y.Z).
#
# One pass: `prepare` resolves the version and creates the tag when missing, then
# `release`, `binary` and `image` run in the SAME workflow run (a tag pushed with
# GITHUB_TOKEN would not re-trigger the workflow).
#
# Image push to Docker Hub requires DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets.

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version + tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be bare semver x.y.z, got: ${version}" >&2
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "tag ${tag} already exists — nothing to release"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    name: GitHub release
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true

  binary:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          name="cli-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/kapetim/cli/src/pkg/version.Version=${{ needs.prepare.outputs.version }}" \
            -o "$name" ./src
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: cli-${{ matrix.goos }}-${{ matrix.goarch }}

  image:
    name: Publish image (Docker Hub)
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: creds
        name: Check Docker Hub credentials
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.creds.outputs.ok == 'true'
        name: Build and push
        run: |
          set -euo pipefail
          image="kapetim/cli:${{ needs.prepare.outputs.version }}"
          docker build -t "$image" .
          docker push "$image"
