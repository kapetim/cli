name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o cli ./src/cmd/cli
      - name: Test
        run: go test ./...
      - name: Self-validate (markdown)
        run: ./cli validate .

  image:
    name: Image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cli:test .
      - name: Tool presence
        run: |
          set -euo pipefail
          docker run --rm cli:test sh -c '
            cli version &&
            git --version &&
            git lfs version &&
            jq --version &&
            shellcheck --version &&
            zip --version | head -1 &&
            unzip -v | head -1
          '
